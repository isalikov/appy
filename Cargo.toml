[workspace]
resolver = "3"
members = [ "apps/cli" ]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
repository = "https://github.com/isalikov/appy"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = [
  "derive",
  "env"
] }
crossterm = "0.29.0"
ratatui = "0.30.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
