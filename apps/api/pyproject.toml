[project]
name = "appy-api"
version = "0.1.0"
description = "Appy HTTP API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.156.8",
    "pgvector>=0.5.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "appy_api"
