# Git hooks. Installed automatically by `pnpm install` (root `prepare` script)
# and by `mise run setup`; manually: `lefthook install`.
# pre-commit: fast, staged files only. pre-push: full checks, run sequentially
# so a push never saturates the machine.

pre-commit:
  parallel: true
  jobs:
    - name: ruff
      glob: '*.py'
      # --force-exclude: honour extend-exclude for explicitly passed files.
      run: uv run ruff format --force-exclude {staged_files} && uv run ruff check --fix --force-exclude {staged_files}
      stage_fixed: true

    - name: eslint
      glob: '*.{js,ts,vue,json,jsonc,yaml,yml,md,toml}'
      exclude:
        - packages/api-client/src/schema.d.ts
        - '.claude/skills/**'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: rustfmt
      glob: '*.rs'
      run: cargo fmt --all -- {staged_files}
      stage_fixed: true

    - name: no-env-files
      glob: '.env*'
      exclude:
        - .env.example
      run: 'echo "Refusing to commit env files {staged_files}" && exit 1'

commit-msg:
  jobs:
    - name: conventional-commit
      run: scripts/check-commit-msg.sh {1}

pre-push:
  parallel: false
  jobs:
    - name: python
      run: uv run ruff check . && uv run mypy && uv run pytest -m "not integration" -q

    - name: frontend
      run: pnpm typecheck && pnpm test

    - name: rust
      run: cargo clippy --workspace --all-targets --locked -- -D warnings && cargo test --workspace --locked
